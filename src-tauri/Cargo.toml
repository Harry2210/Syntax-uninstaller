[package]
name = "syntax-uninstaller"
version = "1.1.0"
description = "Professional Windows software management and uninstallation suite"
authors = ["Syntax Software Labs"]
edition = "2021"

[lib]
name = "syntax_uninstaller_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.12", features = ["v4"] }
rusqlite = { version = "0.33", features = ["bundled"] }
winreg = "0.55"
walkdir = "2.5"
# Native Windows inventory APIs. Reading the Service Control Manager and the
# Task Scheduler through COM avoids spawning PowerShell for every scan.
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_Services",
] }
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Variant",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
