<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Syntax Uninstaller">
  <title>Syntax Uninstaller</title>
  <defs>
    <linearGradient id="syntaxBg" x1="64" y1="32" x2="452" y2="484" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6" />
      <stop offset="0.52" stop-color="#7C5CFC" />
      <stop offset="1" stop-color="#22C7A9" />
    </linearGradient>
    <linearGradient id="syntaxSheen" x1="256" y1="0" x2="256" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="syntaxEdge" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Rounded app tile -->
  <rect width="512" height="512" rx="116" fill="url(#syntaxBg)" />
  <rect width="512" height="512" rx="116" fill="url(#syntaxSheen)" />

  <!-- Stylised "S" sweep: the S of Syntax, drawn as one clean stroke -->
  <path
    d="M334 170c0-40-40-64-84-64-50 0-84 28-84 68 0 42 38 58 88 70 50 12 94 30 94 76 0 46-38 78-92 78-48 0-84-24-84-64"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="56"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Clean-up spark -->
  <circle cx="386" cy="128" r="15" fill="#FFFFFF" fill-opacity="0.92" />

  <!-- Inner edge highlight keeps the mark crisp on light backgrounds -->
  <rect x="5" y="5" width="502" height="502" rx="111" fill="none" stroke="url(#syntaxEdge)" stroke-width="6" />
</svg>
