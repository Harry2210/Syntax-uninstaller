<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Syntax Uninstaller — clean software removal, junk cleanup and Windows privacy tools."
    />
    <title>Syntax Uninstaller</title>

    <!--
      Theme bootstrap: runs before the first paint so the window never flashes
      the wrong palette. Mirrors services/preferences.ts (same storage key and
      same "match Windows" rule).
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('syntax_settings');
          var settings = raw ? JSON.parse(raw) : {};
          var mode = settings.theme || 'dark';
          var light =
            mode === 'light' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
          var root = document.documentElement;
          root.classList.toggle('light', light);
          root.classList.toggle('dark', !light);
          root.classList.toggle('high-contrast', settings.highContrast === true);
          root.style.colorScheme = light ? 'light' : 'dark';
        } catch (e) {
          /* default dark */
        }
      })();
    </script>

    <style>
      /* Paint the correct canvas colour instantly, before the CSS bundle loads. */
      html {
        background-color: #0b0f19;
      }
      html.light {
        background-color: #f4f6fb;
      }
      #boot-splash {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
        color: #98a4b7;
      }
      html.light #boot-splash {
        color: #64748b;
      }
      #boot-splash .boot-title {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #f5f7fb;
      }
      html.light #boot-splash .boot-title {
        color: #0f172a;
      }
      #boot-splash .boot-track {
        width: 120px;
        height: 2px;
        border-radius: 2px;
        overflow: hidden;
        background: #1b2638;
      }
      html.light #boot-splash .boot-track {
        background: #dbe3ef;
      }
      @keyframes bootSlide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        @keyframes bootSlide {
          0%,
          100% {
            transform: none;
          }
        }
      }
    </style>
  </head>
  <body
    class="bg-background text-text-primary antialiased select-none overflow-hidden h-screen w-screen"
  >
    <div id="root" class="h-full w-full">
      <!-- Boot splash: replaced as soon as React mounts, so there is never a blank frame -->
      <div id="boot-splash">
        <img
          src="/logo.svg"
          alt=""
          width="56"
          height="56"
          style="border-radius: 16px; box-shadow: 0 0 32px -6px rgba(124, 92, 252, 0.6)"
        />
        <div style="text-align: center; line-height: 1.6">
          <div class="boot-title">SYNTAX</div>
          <div style="font-size: 11px">Starting the scanning engine…</div>
        </div>
        <div class="boot-track">
          <div
            style="
              width: 40%;
              height: 100%;
              border-radius: 2px;
              background: linear-gradient(90deg, #7c5cfc, #22c7a9);
              animation: bootSlide 1.1s ease-in-out infinite;
            "
          ></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
